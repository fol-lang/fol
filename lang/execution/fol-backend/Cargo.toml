[package]
name = "fol-backend"
version.workspace = true
edition = "2021"
authors = ["Trim Bresilla <trim.bresilla@gmail.com>"]
description = "Backend code generation for executable FOL programs"

[lib]
name = "fol_backend"
path = "src/lib.rs"

[dependencies]
fol-intrinsics = { path = "../../compiler/fol-intrinsics" }
fol-lower = { path = "../../compiler/fol-lower" }
fol-parser = { path = "../../compiler/fol-parser" }
fol-resolver = { path = "../../compiler/fol-resolver" }
fol-runtime = { path = "../fol-runtime" }
fol-abi = { path = "../../compiler/fol-abi" }
fol-types = { path = "../../compiler/fol-types" }
fol-build = { path = "../fol-build" }

[dev-dependencies]
fol-testkit = { path = "../../tooling/fol-testkit" }
fol-lexer = { path = "../../compiler/fol-lexer" }
fol-package = { path = "../../compiler/fol-package" }
fol-stream = { path = "../../compiler/fol-stream" }
fol-typecheck = { path = "../../compiler/fol-typecheck" }
