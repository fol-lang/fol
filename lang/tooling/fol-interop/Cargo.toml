[package]
name = "fol-interop"
version.workspace = true
edition = "2021"
authors = ["Trim Bresilla <trim.bresilla@gmail.com>"]
description = "Checked FOL handoff to the PARC, LINC, and GERC interop pipeline"

[lib]
name = "fol_interop"
path = "src/lib.rs"

[dependencies]
fol-abi = { path = "../../compiler/fol-abi" }
fol-build = { path = "../../execution/fol-build" }
fol-types = { path = "../../compiler/fol-types" }
# Pinned by git revision, not by sibling path: a fresh clone must be able to
# build and test without four repositories checked out side by side. The parc
# revision must match the one linc and gerc pin, or cargo resolves two distinct
# `follang-parc` crates and every shared type stops matching.
gerc = { package = "follang-gerc", version = "=0.1.0", git = "https://github.com/fol-lang/gerc", rev = "df0479a1074a1a3d50022ca6a28cdec4221987dd", default-features = false, features = ["pipeline-native"] }
linc = { package = "follang-linc", version = "=0.1.0", git = "https://github.com/fol-lang/linc", rev = "38f73db2d14e3b877e430d59220c8ea0d6c92e85", default-features = false, features = ["native-inspection"] }
parc = { package = "follang-parc", version = "=0.16.0", git = "https://github.com/fol-lang/parc", rev = "0f52aeeeeec47a082c0d8a515130ee853aa1101d" }

[dev-dependencies]
fol-testkit = { path = "../fol-testkit" }
