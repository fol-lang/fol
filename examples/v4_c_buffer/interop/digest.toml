version = 1

# C carries a buffer as two unrelated parameters. The overlay pairs them, so
# FOL passes one value and the length is derived from it rather than trusted.
[routine.digest_sum]
error = "infallible"
buffer = "bytes"
buffer_length = "count"
reads = ["bytes"]

# The same pair, declared as written rather than read. Without the direction
# the pointee's non-constness would be taken as the answer, which is a guess.
[routine.digest_fill]
error = "infallible"
buffer = "bytes"
buffer_length = "count"
writes = ["bytes"]

# A domain of provider-allocated buffers, paired with the one routine that
# frees them -- the same shape a handle domain has, for the same reason.
[buffer.Bytes]
destroy = "digest_release"

[routine.digest_take]
error = "infallible"
buffer_domain = "Bytes"
buffer_role = "produces"
buffer_length = "out_len"
buffer_capacity = "out_capacity"

# Never callable from FOL: the adapter calls it, and FOL holds a copy.
[routine.digest_release]
error = "infallible"
buffer_domain = "Bytes"
buffer_role = "consumes"
buffer_length = "count"

[routine.digest_live]
error = "infallible"
