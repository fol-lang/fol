[workspace]
# Every member, so a bare `cargo build`/`cargo test` at the root covers the
# whole workspace instead of silently skipping 16 crates' suites.
default-members = [
    ".",
    "lang/compiler/fol-types",
    "lang/compiler/fol-abi",
    "lang/compiler/fol-stream",
    "lang/compiler/fol-lexer",
    "lang/compiler/fol-parser",
    "lang/compiler/fol-package",
    "lang/compiler/fol-diagnostics",
    "lang/compiler/fol-resolver",
    "lang/compiler/fol-typecheck",
    "lang/compiler/fol-lower",
    "lang/compiler/fol-intrinsics",
    "lang/execution/fol-build",
    "lang/execution/fol-runtime",
    "lang/execution/fol-backend",
    "lang/tooling/fol-frontend",
    "lang/tooling/fol-editor",
    "lang/tooling/fol-interop",
    "lang/tooling/fol-self",
    "lang/tooling/fol-testkit",
]
members = [
    "lang/compiler/fol-types",
    "lang/compiler/fol-abi",
    "lang/compiler/fol-stream",
    "lang/compiler/fol-lexer",
    "lang/compiler/fol-parser",
    "lang/compiler/fol-package",
    "lang/compiler/fol-diagnostics",
    "lang/compiler/fol-resolver",
    "lang/compiler/fol-typecheck",
    "lang/compiler/fol-lower",
    "lang/compiler/fol-intrinsics",
    "lang/execution/fol-build",
    "lang/execution/fol-runtime",
    "lang/execution/fol-backend",
    "lang/tooling/fol-frontend",
    "lang/tooling/fol-editor",
    "lang/tooling/fol-interop",
    "lang/tooling/fol-self",
    "lang/tooling/fol-testkit",
]

[workspace.package]
version = "0.2.6"

[package]
name = "fol"
version.workspace = true
authors = ["Trim Bresilla <trim.bresilla@gmail.com>"]
edition = "2021"

[[bin]]
name = "folc"
path = "lang/tooling/fol-frontend/src/main.rs"

[dependencies]
fol-frontend = { path = "lang/tooling/fol-frontend" }

[[test]]
name = "integration"
path = "test/run_tests.rs"

# M3 native products. Separate from `integration` because these hand real
# archives to a C compiler: a failure means a library FOL claims to produce is
# not one a consumer can link.
[[test]]
name = "native"
path = "test/native_products.rs"

# M5's scalar C export slice. Builds a FOL library, installs it, and compiles a
# C program against the installed prefix using the generated header.
[[test]]
name = "v4_c_export"
path = "test/v4_c_export.rs"

# M6's scalar C import slice. Runs the real PARC/LINC/GERC pipeline, builds a
# FOL program that calls the result, and executes it. Separate from
# `integration` because it needs a C toolchain and an explicit probe directory.
[[test]]
name = "v4_c_import"
path = "test/v4_c_import.rs"

# The ASan/UBSan boundary lane section 16 requires for the M7 pointer and
# resource slices. Separate from `v4_c_export` because it needs a
# sanitizer-capable C toolchain and runs each consumer instrumented.
[[test]]
name = "v4_c_sanitize"
path = "test/v4_c_sanitize.rs"

# M7.4's linear resource discipline. Separate from `integration` because each
# test runs the compiler over a checked-in example and reads its diagnostic,
# which is the only place the rule can be shown to hold.
[[test]]
name = "v4_linear"
path = "test/v4_linear.rs"

# M7.4 opaque C handles. Separate because it needs the full PARC/LINC/GERC
# pipeline and a C toolchain, which `integration` does not require.
[[test]]
name = "v4_c_handle"
path = "test/v4_c_handle.rs"

# M7.5 synchronous callbacks. Same toolchain requirement as `v4_c_handle`:
# proving C actually invokes a FOL closure needs the real pipeline.
[[test]]
name = "v4_c_callback"
path = "test/v4_c_callback.rs"

[dev-dependencies]
fol-types = { path = "lang/compiler/fol-types" }
fol-stream = { path = "lang/compiler/fol-stream" }
fol-lexer = { path = "lang/compiler/fol-lexer" }
fol-parser = { path = "lang/compiler/fol-parser" }
fol-package = { path = "lang/compiler/fol-package" }
fol-diagnostics = { path = "lang/compiler/fol-diagnostics" }
fol-resolver = { path = "lang/compiler/fol-resolver" }
fol-typecheck = { path = "lang/compiler/fol-typecheck" }
fol-intrinsics = { path = "lang/compiler/fol-intrinsics" }
fol-editor = { path = "lang/tooling/fol-editor" }
fol-runtime = { path = "lang/execution/fol-runtime" }
fol-testkit = { path = "lang/tooling/fol-testkit" }
serde_json = "1"
