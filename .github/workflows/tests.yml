name: tests

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  # Lets the release workflow gate a tag on exactly this verification.
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a tag run: a release depends on its result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout FOL
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: fol
          # `make fmt-check` diffs against an audited baseline commit.
          fetch-depth: 0

      # rust-toolchain.toml pins the version for CI, the nix shell, and local
      # rustup alike, so there is one source of truth.
      - name: Show Rust toolchain
        working-directory: fol
        run: |
          rustup show
          rustc --version
          cargo --version

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
        with:
          workspaces: fol

      # Same build the nix dev shell pins in flake.nix, verified by checksum
      # rather than rebuilt from source: fol-editor regenerates the grammar
      # with this CLI and asserts against the bytes it emits, so the version
      # is exact and the download must be the exact artifact it claims to be.
      - name: Install tree-sitter CLI
        run: |
          set -euo pipefail
          version=0.26.8
          digest=9754a32800f0b970152782df177b4a47c711e34e651a7aceb384d8bd29fa136e
          curl -fL --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 300 --retry 2 \
            -o tree-sitter.gz \
            "https://github.com/tree-sitter/tree-sitter/releases/download/v$version/tree-sitter-linux-x64.gz"
          echo "$digest  tree-sitter.gz" | sha256sum --check --strict -
          mkdir -p "$HOME/.cargo/bin"
          gzip -dc tree-sitter.gz > "$HOME/.cargo/bin/tree-sitter"
          chmod +x "$HOME/.cargo/bin/tree-sitter"
          rm tree-sitter.gz
          tree-sitter --version

      - name: Install native prerequisites
        run: sudo apt-get update && sudo apt-get install --yes binutils build-essential

      - name: Run repository verification
        working-directory: fol
        run: make verify
