name: tests

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  # Lets the release workflow gate a tag on exactly this verification.
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a tag run: a release depends on its result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout FOL
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: fol
          # `make fmt-check` diffs against an audited baseline commit.
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
        with:
          workspaces: fol

      # The flake is the single toolchain source: pinned Rust, the pinned
      # tree-sitter CLI that fol-editor's build script needs, gcc for the
      # interop smoke, and mdbook for the docs target.
      - name: Run repository verification
        working-directory: fol
        run: |
          nix develop --command sh -euc '
            rustc --version
            cargo --version
            tree-sitter --version
            make verify
          '
