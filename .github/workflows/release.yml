name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # A tag must agree with the tree it points at before anything is published.
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check the tag against the workspace version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          case "$tag" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "tag $GITHUB_REF_NAME is not vX.Y.Z" >&2; exit 1 ;;
          esac
          # -s and tail: the Makefile prints a banner before the version.
          version="$(make -s print-version | tail -n1)"
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match workspace version $version" >&2
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches workspace version $version"

  # Publishing an unverified tree is what let broken releases ship before.
  verify:
    needs: guard
    uses: ./.github/workflows/tests.yml

  create_release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "fol $GITHUB_REF_NAME" \
            --notes "FOL toolchain $GITHUB_REF_NAME — install with: fol self install $version"

  toolchain:
    needs: create_release
    name: toolchain ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-linux
            triple: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-linux
            triple: aarch64-unknown-linux-musl
    steps:
      - name: Checkout FOL
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: fol

      - name: Install Nix
        uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
        with:
          workspaces: fol

      # The flake is the only toolchain source: pinned Rust, the pinned
      # tree-sitter CLI, and a musl C toolchain for fol-editor's generated
      # `parser.c`. The release shell targets musl so one artifact runs on any
      # Linux, rather than against the runner's glibc.
      - name: Build folc and fol
        working-directory: fol
        run: |
          nix develop .#release --command sh -euc '
            rustc --version
            tree-sitter --version
            cargo build --release --locked --bin folc
            cargo build --release --locked -p fol-self
          '

      # A silent fall back to the host toolchain would ship binaries that die on
      # the musl systems this targets, so the link is proven rather than assumed.
      - name: Verify the binaries are static musl
        working-directory: fol
        run: |
          for binary in "target/${{ matrix.triple }}/release/folc" "target/${{ matrix.triple }}/release/fol"; do
            file "$binary"
            if ! file "$binary" | grep -q "statically linked"; then
              echo "$binary is not statically linked" >&2
              exit 1
            fi
          done

      - name: Stage and pack toolchain
        working-directory: fol
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="$(mktemp -d)"
          cp "target/${{ matrix.triple }}/release/folc" "$STAGE/folc"
          cp -R lang/library/std "$STAGE/std"
          # folc compiles emitted Rust against the runtime crate sources, so
          # the toolchain ships them beside the binary.
          mkdir "$STAGE/runtime"
          cp lang/execution/fol-runtime/Cargo.toml "$STAGE/runtime/Cargo.toml"
          cp -R lang/execution/fol-runtime/src "$STAGE/runtime/src"
          # Archive root must hold exactly {folc, std/, runtime/} — `fol self
          # install` unpacks it straight into $FOL_HOME/toolchains/v$VERSION/.
          tar -czf "fol-compiler-and-lib-v${VERSION}-${{ matrix.target }}.tar.gz" -C "$STAGE" folc std runtime
          # fol itself, ready to drop on PATH.
          cp "target/${{ matrix.triple }}/release/fol" "fol-v${VERSION}-${{ matrix.target }}"

      - name: Publish checksums
        working-directory: fol
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Per-target files: the matrix jobs upload concurrently, so a single
          # shared SHA256SUMS would lose one target's lines.
          sha256sum \
            "fol-compiler-and-lib-v${VERSION}-${{ matrix.target }}.tar.gz" \
            "fol-v${VERSION}-${{ matrix.target }}" \
            > "SHA256SUMS-${{ matrix.target }}"
          cat "SHA256SUMS-${{ matrix.target }}"

      - name: Upload release assets
        working-directory: fol
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            "fol-compiler-and-lib-v${VERSION}-${{ matrix.target }}.tar.gz" \
            "fol-v${VERSION}-${{ matrix.target }}" \
            "SHA256SUMS-${{ matrix.target }}" \
            --clobber
