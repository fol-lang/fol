name: network

# The ignored integration tests fetch real repositories, so they are excluded
# from `make verify` (and therefore from the release gate). They still need to
# run somewhere: a nightly job keeps them honest without making every push and
# every release depend on GitHub being reachable.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  network:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FOL
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: fol

      - name: Show Rust toolchain
        working-directory: fol
        run: rustup show

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
        with:
          workspaces: fol

      - name: Install native prerequisites
        run: sudo apt-get update && sudo apt-get install --yes binutils build-essential

      - name: Run the network-dependent tests
        working-directory: fol
        run: make test-network
