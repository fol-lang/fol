name: network

# The ignored integration tests fetch real repositories, so they are excluded
# from `make verify` (and therefore from the release gate). They still need to
# run somewhere: a nightly job keeps them honest without making every push and
# every release depend on GitHub being reachable.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  network:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout FOL
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: fol

      - name: Install Nix
        uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
        with:
          workspaces: fol

      - name: Run the network-dependent tests
        working-directory: fol
        run: nix develop --command make test-network
