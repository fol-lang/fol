name: Install the pinned tree-sitter CLI
description: >
  fol-editor generates its parser from grammar.json during the build, so this
  CLI is a build dependency for the whole workspace, not only a test one. The
  series must match REQUIRED_TREE_SITTER_VERSION; another series emits a
  different parser ABI. Fetched by checksum rather than rebuilt from source, so
  the download must be the exact artifact it claims to be.

runs:
  using: composite
  steps:
    - name: Install tree-sitter CLI
      shell: bash
      run: |
        set -euo pipefail
        version=0.26.8
        case "$(uname -m)" in
          x86_64)
            asset=linux-x64
            digest=9754a32800f0b970152782df177b4a47c711e34e651a7aceb384d8bd29fa136e
            ;;
          aarch64)
            asset=linux-arm64
            digest=e339d6533b20830dd1666fe320aff85d301b3f59964a3836870b77f4827f9a17
            ;;
          *)
            echo "no tree-sitter CLI pinned for $(uname -m)" >&2
            exit 1
            ;;
        esac
        curl -fL --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 300 --retry 2 \
          -o tree-sitter.gz \
          "https://github.com/tree-sitter/tree-sitter/releases/download/v$version/tree-sitter-$asset.gz"
        echo "$digest  tree-sitter.gz" | sha256sum --check --strict -
        mkdir -p "$HOME/.cargo/bin"
        gzip -dc tree-sitter.gz > "$HOME/.cargo/bin/tree-sitter"
        chmod +x "$HOME/.cargo/bin/tree-sitter"
        rm tree-sitter.gz
        tree-sitter --version
